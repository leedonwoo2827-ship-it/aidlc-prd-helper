AWSTemplateFormatVersion: '2010-09-09'
Description: AI-DLC PRD Helper - expiring workshop accounts and isolated streaming conversations
Parameters:
  WebOrigin:
    Type: String
    Default: ''
  ModelId:
    Type: String
    MinLength: 1
    Description: Customer-selected model or inference profile supporting ConverseStream and JSON Schema output.
  BedrockResourceArns:
    Type: CommaDelimitedList
    Description: Explicit model and inference-profile ARNs authorized for this customer deployment.
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
  Store:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-workshops'
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      UsernameConfiguration: {CaseSensitive: false}
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: admin_only, Priority: 1}]
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 1
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: workshop-browser
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 15
      AccessTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits: {IdToken: minutes, AccessToken: minutes, RefreshToken: days}
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogGroup', 'logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem', 'dynamodb:DeleteItem']
                Resource: !GetAtt Store.Arn
              - Effect: Allow
                Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream']
                Resource: !Ref BedrockResourceArns
              - Effect: Allow
                Action: ['cognito-idp:AdminDisableUser', 'cognito-idp:AdminDeleteUser']
                Resource: !GetAtt UserPool.Arn
  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 512
      Timeout: 120
      ReservedConcurrentExecutions: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref Store
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref Client
          BEDROCK_MODEL_ID: !Ref ModelId
          PUBLIC_ORIGIN: !Ref WebOrigin
      Code:
        ZipFile: |
          exports.handler = awslambda.streamifyResponse(async (event, stream) => {
            const out = awslambda.HttpResponseStream.from(stream, {statusCode:401,headers:{"Content-Type":"application/json","WWW-Authenticate":'Bearer realm="Cognito workshop"',"Cache-Control":"no-store"}});
            out.write(JSON.stringify({error:{code:"LOGIN_REQUIRED",message:"Authentication is required."}}));
            out.end();
            await require("node:stream/promises").finished(out);
          });
  FunctionLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 7
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: AWS_IAM
      InvokeMode: RESPONSE_STREAM
  StaticOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-static
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ApiOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-api
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4
  ResponsePolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true}
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AI-DLC PRD Helper
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        ViewerCertificate: {CloudFrontDefaultCertificate: true, MinimumProtocolVersion: TLSv1.2_2021}
        Origins:
          - Id: static
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref StaticOAC
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt FunctionUrl.FunctionUrl]]
            OriginAccessControlId: !Ref ApiOAC
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: static
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref ResponsePolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref ResponsePolicy
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      InvokedViaFunctionUrl: true
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  ExpiryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: expire-workshop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Function.Arn
Outputs:
  SiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  DistributionId: {Value: !Ref Distribution}
  BucketName: {Value: !Ref SiteBucket}
  FunctionName: {Value: !Ref Function}
  FunctionArn: {Value: !GetAtt Function.Arn}
  FunctionUrl: {Value: !GetAtt FunctionUrl.FunctionUrl}
  TableName: {Value: !Ref Store}
  UserPoolId: {Value: !Ref UserPool}
  ClientId: {Value: !Ref Client}
  ExpiryRoleArn: {Value: !GetAtt ExpiryRole.Arn}
